<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>もんでくる人モミックス 注意喚起</title>
  <style>
    body {
      background: linear-gradient(135deg, #e3eafc 0%, #f8fafc 100%);
      font-family: 'Yu Gothic UI', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    .window {
      max-width: 420px;
      margin: 60px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(60,60,60,0.18), 0 1.5px 4px #b6c6e0;
      border: 1px solid #e3eafc;
      overflow: hidden;
    }
    .titlebar {
      background: linear-gradient(90deg, #e3eafc 0%, #c7d7f9 100%);
      padding: 12px 20px;
      font-size: 1.15em;
      font-weight: bold;
      color: #2d3a4a;
      border-bottom: 1px solid #d0d7e6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block;
    }
    .dot.red { background: #e57373; }
    .dot.yellow { background: #ffd54f; }
    .dot.green { background: #81c784; }
    .content {
      padding: 28px 24px 20px 24px;
    }
    h2 {
      color: #2563eb;
      font-size: 1.08em;
      margin: 22px 0 8px 0;
    }
    ul {
      margin: 0 0 18px 22px;
      padding: 0;
    }
    .advice {
      background: #e3f2fd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 18px;
      color: #1976d2;
      font-weight: bold;
      text-align: center;
    }
    .footer {
      text-align: right;
      color: #8a99b3;
      font-size: 0.95em;
      padding: 10px 18px 12px 0;
      border-top: 1px solid #e3eafc;
      background: #f7faff;
    }
    .win-btn, .soudan-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 1em;
      margin-top: 18px;
      box-shadow: 0 2px 8px #c7d7f9;
      cursor: pointer;
      transition: background 0.2s;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .win-btn:hover, .soudan-btn:hover {
      background: #1746a0;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      もんでくる人モミックス 注意喚起
    </div>
    <div class="content">
      <h2>あなたを触ってくる人に注意！</h2>
      <h2>触ってくる人の特徴</h2>
      <ul>
        <li>キモい</li>
      </ul>
      <h2>対処法のポイント</h2>
      <ul>
        <li>はっきり「やめて」と伝える</li>
        <li>周囲に助けを求める</li>
        <li>証拠を残す（録音やメモ）</li>
        <li>必要なら警察や先生へ相談</li>
      </ul>
      <div class="advice">無理しないでね</div>
      <button class="win-btn" onclick="alert('応援しています！')">OK</button>
      <button class="soudan-btn" onclick="window.open('https://www.npa.go.jp/bureau/safetylife/soudan.html','_blank')">
        警察相談窓口に相談する
      </button>
    </div>
    <div class="footer">© 2025 もんでくる人
