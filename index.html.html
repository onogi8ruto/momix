<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>触ってくる人の特徴と対処法 | 注意喚起サイト</title>
<style>
  /* One UI風 基本カラー */
  :root {
    --primary-color: #0a84ff; /* Samsung Blue風 */
    --background-color: #f9fafc;
    --card-background: #ffffff;
    --text-color: #1a1a1a;
    --secondary-text: #6b6b6b;
    --border-radius: 12px;
    --font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    margin: 0;
    background-color: var(--background-color);
    font-family: var(--font-family);
    color: var(--text-color);
  }

  header {
    background-color: var(--primary-color);
    color: white;
    padding: 1.2rem 1rem;
    font-size: 1.5rem;
    font-weight: 600;
    border-bottom-left-radius: var(--border-radius);
    border-bottom-right-radius: var(--border-radius);
  }

  main {
    max-width: 600px;
    margin: 1.5rem auto;
    padding: 0 1rem;
  }

  h1 {
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  p.lead {
    color: var(--secondary-text);
    font-size: 1.1rem;
    margin-bottom: 1.5rem;
  }

  .card {
    background-color: var(--card-background);
    border-radius: var(--border-radius);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 1rem 1.2rem;
    margin-bottom: 1.2rem;
  }

  .card h2 {
    margin-top: 0;
    font-weight: 600;
    color: var(--primary-color);
  }

  .button-primary {
    display: inline-block;
    background-color: var(--primary-color);
    color: white;
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: var(--border-radius);
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }

  .button-primary:hover {
    background-color: #005fcc;
  }

  footer {
    text-align: center;
    color: var(--secondary-text);
    font-size: 0.9rem;
    padding: 1rem 1rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
<header>
  もんでくる人モミックス
</header>
<main>
  <h1>あなたを触ってくる人に注意！</h1>
  <p class="lead">
  。</p>

  <section class="card">
    <h2>触ってくる人の特徴</h2>
    <ul>
      <li>キモい</li>
    
    </ul>
  </section>

  <section class="card">
    <h2>対処法のポイント</h2>
    <ul>
      <li>はっきり「やめて」と伝える</li>
      <li>周囲に助けを求める</li>
      <li>証拠を残す（録音やメモ）</li>
      <li>必要なら警察や先生へ相談</li>
    </ul>
  </section>

  <a href="#" class="button-primary">無理しないでね
  
  </a><!DOCTYPE html>
<html lang="ja">
